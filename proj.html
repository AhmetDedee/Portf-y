<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By KuTon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Logitech tarzı arka plan deseni */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.01) 35px, rgba(255,255,255,.01) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(255,255,255,.01) 35px, rgba(255,255,255,.01) 70px);
            pointer-events: none;
        }
        
        .smile-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        
        .smile {
            position: absolute;
            font-family: 'Permanent Marker', cursive;
            font-size: 80px;
            transform: translate(-50%, -50%);
            animation: fadeInBounce 1s ease-out forwards;
            text-shadow: 
                0 0 20px rgba(0, 255, 255, 0.8),
                0 0 40px rgba(0, 255, 255, 0.5),
                3px 3px 0px #ff00ff,
                -3px -3px 0px #00ffff,
                5px 5px 10px rgba(0,0,0,0.5);
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.6));
            z-index: 10;
        }
        
        /* Grafiti spray efekti */
        .smile::before {
            content: ':)';
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.3;
            filter: blur(3px);
            transform: scale(1.1);
            color: #00ffff;
        }
        
        /* Renk varyasyonları */
        .smile:nth-child(odd) {
            color: #00ff00;
            text-shadow: 
                0 0 20px rgba(0, 255, 0, 0.8),
                0 0 40px rgba(0, 255, 0, 0.5),
                3px 3px 0px #ffff00,
                -3px -3px 0px #00ff00,
                5px 5px 10px rgba(0,0,0,0.5);
        }
        
        .smile:nth-child(even) {
            color: #ff00ff;
            text-shadow: 
                0 0 20px rgba(255, 0, 255, 0.8),
                0 0 40px rgba(255, 0, 255, 0.5),
                3px 3px 0px #00ffff,
                -3px -3px 0px #ff00ff,
                5px 5px 10px rgba(0,0,0,0.5);
        }
        
        .smile:nth-child(3n) {
            color: #ffff00;
            text-shadow: 
                0 0 20px rgba(255, 255, 0, 0.8),
                0 0 40px rgba(255, 255, 0, 0.5),
                3px 3px 0px #ff00ff,
                -3px -3px 0px #ffff00,
                5px 5px 10px rgba(0,0,0,0.5);
        }
        
        @keyframes fadeInBounce {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(random(-15deg, 15deg));
            }
        }
        
        /* Logitech logo tarzı köşe detayı */
        .corner-detail {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #00ffff 0%, #0080ff 100%);
            opacity: 0.1;
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }
        
        /* Başlık */
        .title {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Permanent Marker', cursive;
            font-size: 40px;
            color: #00ffff;
            text-shadow: 
                0 0 20px rgba(0, 255, 255, 0.5),
                2px 2px 0px #ff00ff;
            letter-spacing: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="title">Projeler Gizlidir.</div>
    <div class="smile-container" id="smileContainer"></div>
    <div class="corner-detail"></div>
    
    <script>
        const container = document.getElementById('smileContainer');
        let smileCount = 0;
        const maxSmiles = 50; // Maksimum smile sayısı
        
        // İlk smile'ı ekranın tam ortasında başlat
        function createSmile() {
            const smile = document.createElement('div');
            smile.className = 'smile';
            smile.textContent = ':)';
            
            // İlk smile tam ortada, diğerleri rastgele
            if (smileCount === 0) {
                smile.style.left = '50%';
                smile.style.top = '50%';
            } else {
                // Rastgele pozisyon
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                smile.style.left = x + 'px';
                smile.style.top = y + 'px';
            }
            
            // Rastgele rotasyon ekle
            const rotation = Math.random() * 30 - 15;
            smile.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
            
            container.appendChild(smile);
            smileCount++;
            
            // Eski smile'ları temizle
            if (smileCount > maxSmiles) {
                const oldSmile = container.firstChild;
                if (oldSmile) {
                    container.removeChild(oldSmile);
                }
            }
            
            // Fade out efekti
            setTimeout(() => {
                smile.style.opacity = '0.3';
            }, 5000);
        }
        
        // İlk smile'ı hemen oluştur (tam ortada)
        createSmile();
        
        // Her saniye yeni smile ekle
        setInterval(createSmile, 1000);
        
        // Mouse takibi için bonus özellik
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.95) { // %5 ihtimalle
                const smile = document.createElement('div');
                smile.className = 'smile';
                smile.textContent = ':)';
                smile.style.left = e.clientX + 'px';
                smile.style.top = e.clientY + 'px';
                smile.style.fontSize = '40px';
                container.appendChild(smile);
                
                setTimeout(() => {
                    smile.style.opacity = '0';
                }, 2000);
            }
        });
    </script>
</body>
</html>
